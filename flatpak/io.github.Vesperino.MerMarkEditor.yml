id: io.github.Vesperino.MerMarkEditor
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24
command: mdreader
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # AI assistant: Ollama / OpenAI-compatible servers and remote models
  - --share=network
  # Workspaces anywhere in home, saving next to the opened file and watching it for external changes
  - --filesystem=home

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin

modules:
  - name: mermark-editor
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/mermark-editor/cargo
        XDG_CACHE_HOME: /run/build/mermark-editor/flatpak-node/cache
        npm_config_offline: 'true'
        npm_config_manage_package_manager_versions: 'false'
        CI: 'true'
    sources:
      - type: git
        url: https://github.com/Vesperino/MerMarkEditor.git
        tag: v0.8.6
        commit: 710c4602353f58f863d029d2720346e1a5d5666d
      - cargo-sources.json
      - node-sources.json
      - type: archive
        url: https://registry.npmjs.org/pnpm/-/pnpm-11.3.0.tgz
        sha256: 5ade1ef51cf36441f4a00931eaf9003654689eba3684939f70d7576b2dfb8474
        strip-components: 1
        dest: pnpm-cli
    build-commands:
      - node pnpm-cli/bin/pnpm.mjs install --offline --frozen-lockfile --trust-lockfile
      - node pnpm-cli/bin/pnpm.mjs build
      - cargo --offline fetch --manifest-path src-tauri/Cargo.toml --verbose
      - cargo --offline build --release --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol --verbose
      - install -Dm755 src-tauri/target/release/mdreader -t ${FLATPAK_DEST}/bin
      - install -Dm644 flatpak/${FLATPAK_ID}.desktop -t ${FLATPAK_DEST}/share/applications
      - install -Dm644 flatpak/${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - install -Dm644 src-tauri/icons/32x32.png ${FLATPAK_DEST}/share/icons/hicolor/32x32/apps/${FLATPAK_ID}.png
      - install -Dm644 src-tauri/icons/64x64.png ${FLATPAK_DEST}/share/icons/hicolor/64x64/apps/${FLATPAK_ID}.png
      - install -Dm644 src-tauri/icons/128x128.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - install -Dm644 src-tauri/icons/128x128@2x.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm644 src-tauri/icons/512x512.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
